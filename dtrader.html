<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phinix Traders</title>
    <link rel="stylesheet" href="style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#05050b;
color:white;

}

.container{

max-width:430px;
margin:auto;
padding:12px;
padding-bottom:120px;

}

.header{

display:flex;
justify-content:space-between;
align-items:center;
margin-top:10px;

}

.logo{

font-size:20px;
font-weight:bold;
color:#b266ff;

}

.wallet-box{

margin-top:18px;
padding:15px;
border-radius:20px;

background:#0b0b15;

border:1px solid #7a2cff;

box-shadow:0 0 18px rgba(122,44,255,.35);

display:flex;
justify-content:space-between;
align-items:center;

}

.balance{

font-size:13px;

}

.balance h1{

font-size:38px;
margin-top:5px;

}

.wallet-btn{

background:linear-gradient(90deg,#7a2cff,#c94fff);

padding:12px 18px;

border-radius:15px;

font-weight:bold;

cursor:pointer;

}

.tabs{

display:flex;
gap:4px;
margin-top:18px;

}

.tab{

flex:1;

background:#101018;

padding:6px 4px;
font-size:13px;
border-radius:18px;

text-align:center;

cursor:pointer;

border:1px solid #222;

}

.active{

border:1px solid #b266ff;

color:#d77fff;

}

.market{

margin-top:18px;

background:#090913;

padding:15px;

border-radius:20px;

}

.trade-box{
    background:#080814;
    border:1px solid #1a1a2e;
    border-radius:15px;
    padding:8px;
    margin-top:6px;
    color:white;
    font-size:13px;
    width:100%;
    box-sizing:border-box;
    min-height:42px;
    display:flex;
    align-items:center;
}

.price{

margin-top:10px;

font-size:20px;

font-weight:bold;

color:#00ff99;

}

.digits{

display:grid;

grid-template-columns:repeat(5,1fr);

gap:10px;

margin-top:18px;

}

.circle{
    width:68px;
    height:68px;
    border-radius:50%;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    margin:auto;

    background:
        radial-gradient(
            circle at 30% 25%,
            #3a3a48 0%,
            #171722 35%,
            #08080f 75%,
            #030307 100%
        );

    border:2px solid #353545;

    box-shadow:
        inset 4px 4px 8px rgba(255,255,255,.12),
        inset -5px -6px 10px rgba(0,0,0,.8),
        0 4px 10px rgba(0,0,0,.55);

    color:white;
}

.circle span:first-child{

font-size:20px;

font-weight:bold;

}

.circle span:last-child{

font-size:11px;

color:#00ff88;

}

.trade-section{

display:flex;

flex-direction:column;

gap:10px;

margin-top:18px;

}

.buttons{

display:flex;

gap:10px;

margin-top:18px;

}

.over{

flex:1;

background:#00695c;

padding:18px;

border-radius:16px;

text-align:center;

font-weight:bold;

cursor:pointer;

}

.under{

flex:1;

background:#8b0035;

padding:18px;

border-radius:16px;

text-align:center;

font-weight:bold;

cursor:pointer;

}

.selected{

border:2px solid #c94fff;

box-shadow:0 0 15px #c94fff;

}

.bottom-space{

height:80px;

}
    .bot-card{
    background:#161625;
    border:1px solid #2d2d45;
    border-radius:15px;
    padding:15px;
    margin:12px 0;
    color:white;
}

.bot-card h3{
    margin:0;
    font-size:18px;
}

.bot-card p{
    color:#bdbdbd;
    font-size:13px;
    margin:8px 0 15px 0;
}

.bot-card button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#7a2cff;
    color:white;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div>☰</div>

<div class="logo">PHINIX TRADERS</div>

<div>🔔</div>

</div>

<div class="wallet-box">

<div class="balance">

Demo Balance

<h1>$10,000</h1>

</div>

<div class="wallet-btn" onclick="changeWallet()">

Wallet ▼

</div>

</div>

<div class="tabs">

<div class="tab" onclick="openDashboard()">
🏠 Dashboard
</div>

<div class="tab active">
📈 Manual Trader
</div>

<div class="tab" onclick="openBots()">
🤖 Phinix Bots
</div>

<div class="tab" onclick="openBotBuilder()">
🛠 Bot Builder
</div>

</div>
<div class="market">

<div class="trade-box" onclick="changeVolatility()">
Volatility 100 (1s) Index ▼
</div>

<div class="price">
6,719.71 ▲ 0.42%
</div>

</div>

<div class="digits">

<div class="circle">
<span>0</span>
<span>10%</span>
</div>

<div class="circle">
<span>1</span>
<span>10%</span>
</div>

<div class="circle">
<span>2</span>
<span>10%</span>
</div>

<div class="circle">
<span>3</span>
<span>10%</span>
</div>

<div class="circle">
<span>4</span>
<span>10%</span>
</div>

<div class="circle">
<span>5</span>
<span>10%</span>
</div>

<div class="circle">
<span>6</span>
<span>10%</span>
</div>

<div class="circle">
<span>7</span>
<span>10%</span>
</div>

<div class="circle">
<span>8</span>
<span>10%</span>
</div>

<div class="circle">
<span>9</span>
<span>10%</span>
</div>

</div>

<div class="trade-section">

<div class="trade-box" onclick="changeTicks()">
Number of ticks: 1 ▼
</div>

<div class="trade-box" onclick="changeContract()">
Over / Under ▼
</div>

<div class="trade-box" onclick="changeStake()">
Stake: 125 USD
</div>

<div class="buttons">

    <div class="over">
        OVER
    </div>

    <div class="under">
        UNDER
    </div>

</div>

</div>

<div class="bottom-space"></div>

<script src="script.js"></script>

</body>

</html>
